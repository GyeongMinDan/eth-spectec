# Pure Capella Teku config
# Based on mainnet preset with fork epochs set to 0

network: "mainnet"

# Fork epochs - all set to 0 for pure Capella network
altair-fork-epoch: 0
bellatrix-fork-epoch: 0
capella-fork-epoch: 0
deneb-fork-epoch: 75520

# Time parameters
seconds-per-slot: 12
slots-per-epoch: 32

# Genesis
min-genesis-active-validator-count: 16384
genesis-delay: 604800

# Validator cycle
inactivity-score-bias: 4
inactivity-score-recovery-rate: 16
ejection-balance: 16000000000
min-per-epoch-churn-limit: 4
churn-limit-quotient: 65536

# Max operations per block (Capella)
max-bls-to-execution-changes: 16
max-withdrawals-per-payload: 16
max-validators-per-withdrawals-sweep: 16384
